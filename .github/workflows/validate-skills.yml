name: validate-skills

# 技能库是纯文本契约，没有编译步骤；这里的"测试"就是契约校验与技能契约测试。
# on 加引号：YAML 1.1 会把裸 on 解析成布尔值，不同解析器行为不一致。
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送取消上一次未完成的运行，避免排队浪费。
concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-contract:
    name: 仓库级契约校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        # v5 起不再依赖 Node.js 20（已弃用）。
        uses: actions/checkout@v5

      - name: 校验技能库（-Strict：提醒即失败）
        shell: pwsh
        run: ./scripts/check-skills-repo.ps1 -Strict

  skill-contracts:
    name: 技能契约测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      # 自动发现 tests/ 下的契约测试，而不是在 workflow 里硬编码清单：
      # 新增技能时不需要改工作流，也就不会因为忘改而让新技能绕过门禁。
      - name: 运行全部技能契约测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -Path './tests' -Filter 'check-*-skill.ps1' -File | Sort-Object Name)
          if ($tests.Count -eq 0) {
              Write-Error '未发现任何技能契约测试（tests/check-*-skill.ps1）'
              exit 1
          }

          $failed = @()
          foreach ($test in $tests) {
              Write-Output "==== $($test.Name) ===="
              # 每个测试用独立进程执行：同一 pwsh 会话内用 & 调用脚本时，
              # 脚本里的 exit 不会设置 $LASTEXITCODE，会漏判失败。
              & pwsh -NoProfile -File $test.FullName
              if ($LASTEXITCODE -ne 0) { $failed += $test.Name }
          }

          Write-Output ''
          Write-Output "共运行 $($tests.Count) 个技能契约测试，失败 $($failed.Count) 个。"
          if ($failed.Count -gt 0) {
              Write-Output ('失败：' + ($failed -join ', '))
              exit 1
          }
