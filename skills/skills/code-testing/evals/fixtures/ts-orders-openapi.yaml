openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    post:
      operationId: createOrder
      summary: 创建订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 创建成功
          headers:
            Location:
              description: 新订单的地址，形如 /orders/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: 查询订单
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: 订单不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    Order:
      type: object
      required: [id, skuId, quantity, status]
      properties:
        id:
          type: string
        skuId:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [CREATED, PAID, CANCELLED]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
